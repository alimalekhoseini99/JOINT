<html lang="fa" dir="rtl"><head><meta charset="utf-8">

<title>داشبورد مدیریتی جوینت هیستوری – پایپینگ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f6fa;--sf:#fff;--tx:#18202f;--mu:#667085;--bd:#e3e7ee;--pri:#2457d6;--ok:#16915c;--wn:#d98a0b;--bad:#d23b3b;--tr:#e9edf4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--sf:#181e29;--tx:#e8ecf3;--mu:#9aa5b6;--bd:#2a3342;--pri:#6c96ff;--ok:#3ccb8b;--wn:#f0a93a;--bad:#ff6b6b;--tr:#263041;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141c;--sf:#181e29;--tx:#e8ecf3;--mu:#9aa5b6;--bd:#2a3342;--pri:#6c96ff;--ok:#3ccb8b;--wn:#f0a93a;--bad:#ff6b6b;--tr:#263041;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.7 Vazirmatn,Tahoma,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 18px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:17px;margin:0 0 8px;font-weight:800}h2{font-size:15px;margin:0 0 10px}
nav{display:flex;gap:4px;overflow-x:auto}nav a{padding:8px 14px;color:var(--mu);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
nav a.on{color:var(--pri);border-color:var(--pri)}
main{max-width:1250px;margin:auto;padding:16px}
.g{display:grid;gap:12px}.k5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}.g>.c{margin:0}
.kv{font-size:26px;font-weight:800;line-height:1.3}.mu{color:var(--mu);font-size:12px}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--tr) 0)}
.ring i{font-style:normal;background:var(--sf);width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.bar{height:10px;background:var(--tr);border-radius:6px;overflow:hidden;display:flex;min-width:70px}.bar b{background:var(--ok);display:block}.bar s{background:var(--wn);display:block}
.row{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;margin:9px 0}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;background:var(--bg)}
tr[data-l]{cursor:pointer}tr[data-l]:hover{background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}.t1{background:#16915c22;color:var(--ok)}.t2{background:#d98a0b22;color:var(--wn)}.t3{background:#d23b3b22;color:var(--bad)}.t0{color:var(--mu)}
input,select,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer;background:var(--pri);color:#fff;border:0;font-weight:600}button.s{background:var(--tr);color:var(--tx)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.fm label{display:block;font-size:12px;color:var(--mu)}.fm input,.fm select{width:100%}
.big{font-size:13px;padding:10px}a{color:var(--pri)}svg text{fill:var(--mu);font:10px Vazirmatn,Tahoma,sans-serif}
</style></head><body>

 COLS.forEach(c=>D[c].length=N0);D.L.length=D.LU.length=B0[0];D.C.length=B0[1];D.W.length=B0[2];
 E.forEach(push);byL=null;
 const n=D.jn.length,nl=D.L.length;A=new Int32Array(nl*F);
 for(let i=0;i<n;i++){const o=D.li[i]*F,f=D.f[i],h=D.h[i],s=Math.round(D.sz[i]*10);let op=0;
  A[o]++;if(f&1)A[o+1]++;if(f&2)A[o+2]++;if((f&1)&&!(f&2))A[o+3]++;if(!(f&1))A[o+4]++;
  for(let k=0;k<5;k++){if(f>>(2+2*k)&1)A[o+6+k]++;if(f>>(3+2*k)&1)A[o+11+k]++;else if(f>>(2+2*k)&1)op=1}
  if((f&2)&&op)A[o+5]++;if(h&255)A[o+16]++;if(h&256)A[o+17]++;A[o+18]+=s;if(f&2)A[o+19]+=s}
 G=sum(()=>1);route();
}
function sum(fn){const r=new Array(F).fill(0);for(let l=0;l<D.L.length;l++)if(fn(l))for(let j=0;j<F;j++)r[j]+=A[l*F+j];return r}
const row=l=>Array.from(A.subarray(l*F,l*F+F));
const treq=a=>a[6]+a[7]+a[8]+a[9]+a[10],tdn=a=>a[11]+a[12]+a[13]+a[14]+a[15];
const prog=a=>a[0]?30*a[1]/a[0]+50*a[2]/a[0]+20*(treq(a)?tdn(a)/treq(a):1):0;
const kpi=(t,v,s)=>`<div class=c><div class=mu>${t}</div><div class=kv>${v}</div><div class=mu>${s||''}</div></div>`;
function lineRow(l,a){return `<tr data-l="${l}"><td><b>${esc(D.L[l])}</b></td><td>${D.U[D.LU[l]]}</td><td>${fmt(a[0])}</td><td>${p1(pc(a[1],a[0]))}</td><td>${p1(pc(a[2],a[0]))}</td><td>${fmt(a[3])}</td><td>${fmt(a[4])}</td><td>${fmt(treq(a)-tdn(a))}</td><td>${a[16]?`<span class="tag t2">${fmt(a[16])}</span>`:'<span class="tag t1">0</span>'}</td><td style="min-width:120px">${bar(prog(a))}</td></tr>`}
/* ---------- dashboard ---------- */
function dash(){
 const g=G,P=prog(g),hs=100-pc(g[16],g[0]);
 const st=[['Fit-up',g[1],g[0]],['جوشکاری',g[2],g[0]],...T.map((t,k)=>[TN[k],g[11+k],g[6+k]])];
 const stages=st.map(([n,d,t])=>`<div class=row><span>${n}</span>${bar(pc(d,t))}<span class=mu>${fmt(d)} انجام · ${fmt(t-d)} مانده · ${p1(pc(d,t))}</span></div>`).join('');
 const units=D.U.map((u,i)=>[u,sum(l=>D.LU[l]==i)]).filter(x=>x[1][0]).sort((a,b)=>b[1][0]-a[1][0]);
 const ut=tbl(['واحد','جوینت','Fit-up','جوش','آماده جوش','آزمون باز','سلامت داده','پیشرفت کلی'],units.map(([u,a])=>`<tr><td><b>${u}</b></td><td>${fmt(a[0])}</td><td>${p1(pc(a[1],a[0]))}</td><td>${p1(pc(a[2],a[0]))}</td><td>${fmt(a[3])}</td><td>${fmt(treq(a)-tdn(a))}</td><td>${p1(100-pc(a[16],a[0]))}</td><td style="min-width:130px">${bar(prog(a))}</td></tr>`));
 const top=[...Array(D.L.length).keys()].map(l=>[l,row(l)]).sort((a,b)=>b[1][3]-a[1][3]).slice(0,8);
 let wnt=0;for(let l=0;l<D.L.length;l++)wnt+=A[l*F+5];
 const cnt=H.map((_,b)=>0);for(let i=0;i<D.h.length;i++){const h=D.h[i];if(h)for(let b=0;b<9;b++)if(h>>b&1)cnt[b]++}
 const hl=H.map((x,b)=>[x,cnt[b]]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([x,c])=>`<div class=row style="grid-template-columns:1fr 90px"><span>${x[0]} <span class="tag ${x[1]=='c'?'t3':'t2'}">${x[1]=='c'?'بحرانی':'هشدار'}</span></span><b>${fmt(c)}</b></div>`).join('');
 return `<div class="g k5" style="margin-bottom:12px">
 <div class=c style="display:flex;gap:14px;align-items:center"><div class=ring style="--p:${P}"><i>${Math.round(P)}٪</i></div><div><b>پیشرفت کلی</b><div class=mu>۳۰٪ Fit-up + ۵۰٪ جوش + ۲۰٪ آزمون‌ها</div></div></div>
 ${kpi('کل جوینت‌های فعال',fmt(g[0]),`${fmt(D.L.length)} خط · ${fmt(g[18]/10)} Dia-inch`)}
 ${kpi('جوش انجام‌شده',fmt(g[2]),`${p1(pc(g[2],g[0]))} · ${fmt(g[19]/10)} DI`)}
 ${kpi('جوش باقیمانده',fmt(g[0]-g[2]),`${fmt((g[18]-g[19])/10)} DI مانده`)}
 ${kpi('سلامت داده',p1(hs),`${fmt(g[16])} جوینت دارای خطا`)}</div>
 <div class="g k2"><div class=c><h2>کار انجام‌شده و باقیمانده به تفکیک مرحله</h2>${stages}</div>
 <div class=c><h2>روند ماهانه Fit-up و جوش</h2>${trend()}</div></div>
 <div class="g k2"><div class=c><h2>فرانت کاری</h2><div class="g" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
 ${kpi('آماده جوش',fmt(g[3]),'فیت‌آپ شده، جوش نشده')}${kpi('منتظر Fit-up',fmt(g[4]),'فرانت باز نشده')}${kpi('جوش‌شده منتظر آزمون',fmt(wnt),'آزمون باز دارند')}</div>
 ${tbl(['خط (بیشترین فرانت جوش)','آماده جوش'],top.map(([l,a])=>`<tr data-l="${l}"><td>${esc(D.L[l])}</td><td>${fmt(a[3])}</td></tr>`))}<p class=mu><a href="#front">مشاهده کامل فرانت کاری ←</a></p></div>
 <div class=c><h2>سلامت داده – مهم‌ترین خطاها</h2>${hl||'بدون خطا'}<p class=mu><a href="#health">جزئیات سلامت داده ←</a></p></div></div>
 <div class=c><h2>وضعیت به تفکیک واحد</h2>${ut}</div>`;
}
function trend(){
 const m={};for(let i=0;i<D.fd.length;i++){if(D.fd[i]>13900000){(m[D.fd[i]/100|0]=m[D.fd[i]/100|0]||[0,0])[0]++}if(D.wd[i]>13900000){const k=D.wd[i]/100|0;(m[k]=m[k]||[0,0])[1]++}}
 const ks=Object.keys(m).sort().slice(-18),mx=Math.max(1,...ks.map(k=>Math.max(...m[k]))),w=700,h=210,bw=w/ks.length;
 return `<div class=sc><svg viewBox="0 0 ${w} ${h+20}" style="min-width:560px;width:100%">${ks.map((k,i)=>{const a=m[k][0]/mx*h,b=m[k][1]/mx*h,x=i*bw;return `<rect x="${x+4}" y="${h-a}" width="${bw/2-5}" height="${a}" fill="var(--pri)" rx="2"/><rect x="${x+bw/2}" y="${h-b}" width="${bw/2-5}" height="${b}" fill="var(--ok)" rx="2"/><text x="${x+bw/2}" y="${h+14}" text-anchor="middle">${k.slice(2,4)}/${k.slice(4)}</text>`}).join('')}</svg></div><div class=mu><span style="color:var(--pri)">■</span> Fit-up &nbsp; <span style="color:var(--ok)">■</span> جوش (تعداد جوینت در ماه شمسی)</div>`;
}
/* ---------- lines list ---------- */
let LF={q:'',u:'',s:'',n:150};
function lines(){
 return `<div class=f><input id=q placeholder="جستجوی شماره خط…" value="${esc(LF.q)}" style="min-width:240px"><select id=u><option value="">همه واحدها</option>${D.U.map((u,i)=>`<option value="${i}" ${LF.u==i&&LF.u!==''?'selected':''}>${u}</option>`).join('')}</select>
 <select id=s>${[['','همه خطوط'],['rdy','دارای فرانت جوش'],['tst','دارای آزمون باز'],['iss','دارای خطای داده'],['done','تکمیل‌شده']].map(([v,t])=>`<option value="${v}" ${LF.s==v?'selected':''}>${t}</option>`).join('')}</select><span class=mu id=cn></span></div><div id=lt></div>`;
}
function lineList(){
 const q=LF.q.trim().toLowerCase(),r=[];
 for(let l=0;l<D.L.length;l++){const a=row(l);if(!a[0])continue;
  if(q&&!D.L[l].toLowerCase().includes(q))continue;if(LF.u!==''&&D.LU[l]!=LF.u)continue;
  if(LF.s=='rdy'&&!a[3])continue;if(LF.s=='tst'&&treq(a)==tdn(a))continue;if(LF.s=='iss'&&!a[16])continue;if(LF.s=='done'&&!(a[2]==a[0]&&treq(a)==tdn(a)))continue;r.push([l,a])}
 r.sort((x,y)=>D.L[x[0]].localeCompare(D.L[y[0]],'en',{numeric:true}));
 $('#cn').textContent=fmt(r.length)+' خط';
 $('#lt').innerHTML=tbl(['شماره خط','واحد','جوینت','Fit-up','جوش','آماده جوش','منتظر Fit-up','آزمون باز','خطا','پیشرفت'],r.slice(0,LF.n).map(x=>lineRow(...x)))+(r.length>LF.n?`<p><button class=s id=more>نمایش بیشتر (${fmt(r.length-LF.n)} خط دیگر)</button></p>`:'');
 const m=$('#more');if(m)m.onclick=()=>{LF.n+=300;lineList()};
}
/* ---------- line page ---------- */
function linePage(l){
 if(!D.L[l])return '<div class=c>خط یافت نشد</div>';
 if(!byL){byL=D.L.map(()=>[]);for(let i=0;i<D.li.length;i++)byL[D.li[i]].push(i)}
 const a=row(l),P=prog(a);
 const tg=(f,k)=>{const r=f>>(2+2*k)&1,d=f>>(3+2*k)&1;return d?'<span class="tag t1">انجام</span>':r?'<span class="tag t2">درخواست</span>':'<span class="t0">—</span>'};
 const rows=byL[l].map(i=>{const f=D.f[i],h=D.h[i],bad=H.map((x,b)=>h>>b&1?x[0]:'').filter(Boolean).join('، ');
  return `<tr><td><b>${esc(D.jn[i])}</b></td><td>${D.WT[D.wt[i]]}</td><td>${D.sz[i]}</td><td>${f&1?fd(D.fd[i]):'<span class="tag t2">انجام نشده</span>'}</td><td>${esc(D.C[D.fc[i]])||'—'}</td><td>${f&2?fd(D.wd[i]):'<span class="tag t2">انجام نشده</span>'}</td><td>${esc(D.W[D.wl[i]])||'—'}</td>${T.map((_,k)=>`<td>${tg(f,k)}</td>`).join('')}<td>${f>>12&1?'<span class="tag t2">ReWeld</span> ':''}${bad?`<span class="tag t3" title="${bad}">${bad.length>26?bad.slice(0,26)+'…':bad}</span>`:''}</td></tr>`}).join('');
 return `<p><button class=s onclick="history.back()">→ بازگشت</button> <button class=s onclick="print()">چاپ</button></p>
 <div class=c style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class=ring style="--p:${P}"><i>${Math.round(P)}٪</i></div><div style="flex:1;min-width:220px"><h2 style="margin:0;direction:ltr;text-align:right">${esc(D.L[l])}</h2><div class=mu>واحد ${D.U[D.LU[l]]} · ${fmt(a[0])} جوینت · ${fmt(a[18]/10)} Dia-inch</div></div>
 <div>Fit-up: <b>${fmt(a[1])}</b> / ${fmt(a[0])}<br>جوش: <b>${fmt(a[2])}</b> / ${fmt(a[0])}</div><div>آماده جوش: <b>${fmt(a[3])}</b><br>آزمون باز: <b>${fmt(treq(a)-tdn(a))}</b></div></div>
 <div class=c><h2>جوینت‌های این خط</h2>${tbl(['شماره جوینت','نوع','سایز','تاریخ Fit-up','پیمانکار Fit-up','تاریخ جوش','جوشکار',...T,'توضیحات/خطا'],[rows])}</div>`;
}
/* ---------- front work ---------- */
let FS='3';
function front(){
 const r=[...Array(D.L.length).keys()].map(l=>[l,row(l)]).filter(x=>x[1][0]).map(x=>{const a=x[1];return [x[0],a,[0,0,0,a[3],a[4],a[5]][+FS]]}).filter(x=>x[2]>0).sort((a,b)=>b[2]-a[2]);
 const g=G,wnt=[...Array(D.L.length).keys()].reduce((s,l)=>s+A[l*F+5],0);
 return `<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:12px">${kpi('آماده جوش',fmt(g[3]),'فیت‌آپ شده و جوش نشده')}${kpi('منتظر Fit-up',fmt(g[4]),'فیت‌آپ نشده')}${kpi('جوش‌شده منتظر آزمون',fmt(wnt),'حداقل یک آزمون باز')}</div>
 <div class=f><select id=fs>${[['3','فرانت جوش (آماده جوش)'],['4','منتظر Fit-up'],['5','جوش‌شده منتظر آزمون']].map(([v,t])=>`<option value="${v}" ${FS==v?'selected':''}>${t}</option>`).join('')}</select><span class=mu>${fmt(r.length)} خط · مرتب‌شده بر اساس بیشترین تعداد</span></div>
 <div class=c>${tbl(['شماره خط','واحد','تعداد جوینت (فرانت)','کل جوینت','جوش‌نشده','پیشرفت'],r.slice(0,300).map(([l,a,v])=>`<tr data-l="${l}"><td><b>${esc(D.L[l])}</b></td><td>${D.U[D.LU[l]]}</td><td><b>${fmt(v)}</b></td><td>${fmt(a[0])}</td><td>${fmt(a[0]-a[2])}</td><td style="min-width:120px">${bar(prog(a))}</td></tr>`))}${r.length>300?'<p class=mu>۳۰۰ خط اول نمایش داده شده است.</p>':''}</div>`;
}
/* ---------- health ---------- */
let HS=-1;
function health(){
 const cnt=H.map(()=>0);for(let i=0;i<D.h.length;i++){const h=D.h[i];if(h)for(let b=0;b<9;b++)if(h>>b&1)cnt[b]++}
 let smp='';
 if(HS>=0){const idx=[];for(let i=0;i<D.h.length&&idx.length<150;i++)if(D.h[i]>>HS&1)idx.push(i);
  smp=`<div class=c><h2>نمونه رکوردها: ${H[HS][0]}</h2>${tbl(['شماره خط','جوینت','تاریخ Fit-up','تاریخ جوش'],idx.map(i=>`<tr data-l="${D.li[i]}"><td>${esc(D.L[D.li[i]])}</td><td>${esc(D.jn[i])}</td><td>${fd(D.fd[i])}</td><td>${fd(D.wd[i])}</td></tr>`))}<p class=mu>حداکثر ۱۵۰ رکورد اول.</p></div>`}
 return `<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:12px">${kpi('سلامت کلی داده',p1(100-pc(G[16],G[0])),`${fmt(G[16])} از ${fmt(G[0])} جوینت دارای خطا`)}${kpi('رکوردهای حذف‌شده/لغو',fmt(D.ex),'از محاسبات خارج شده‌اند')}</div>
 <div class=c><h2>کنترل‌های کیفیت داده</h2>${tbl(['کنترل','شدت','تعداد','درصد','مشاهده'],H.map((x,b)=>`<tr><td>${x[0]}</td><td><span class="tag ${x[1]=='c'?'t3':'t2'}">${x[1]=='c'?'بحرانی':'هشدار'}</span></td><td>${fmt(cnt[b])}</td><td>${p1(pc(cnt[b],G[0]))}</td><td>${cnt[b]?`<button class=s data-h="${b}">نمونه</button>`:'✔'}</td></tr>`))}</div>${smp}`;
}
/* ---------- entry ---------- */
function entry(){
 const o=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
 return `<div class=c><h2>ثبت جوینت جدید</h2><div class=fm>
 <div><label>شماره خط *</label><input id=e_line list=dl_l></div><div><label>واحد</label><select id=e_unit>${D.U.map((u,i)=>`<option value="${i}">${u}</option>`).join('')}</select></div>
 <div><label>شماره جوینت *</label><input id=e_jn></div><div><label>نوع جوش</label><select id=e_wt>${o(D.WT)}</select></div><div><label>سایز (inch)</label><input id=e_sz type=number step=0.5 min=0></div>
 <div><label>تاریخ Fit-up (1405-08-21)</label><input id=e_fd placeholder="YYYY-MM-DD"></div><div><label>پیمانکار Fit-up</label><input id=e_fc list=dl_c></div>
 <div><label>تاریخ جوش</label><input id=e_wd placeholder="YYYY-MM-DD"></div><div><label>جوشکار</label><input id=e_wl list=dl_w></div>
 ${T.map((t,k)=>`<div><label>${TN[k]}</label><select id=e_t${k}><option value=0>—</option><option value=1>درخواست شده</option><option value=2>انجام شد</option></select></div>`).join('')}</div>
 <datalist id=dl_l>${D.L.slice(0,B0[0]).map(l=>`<option value="${esc(l)}">`).join('')}</datalist><datalist id=dl_c>${o(D.C.filter(Boolean))}</datalist><datalist id=dl_w>${o(D.W.filter(Boolean))}</datalist>
 <p><button id=add class=big>➕ افزودن به جدول</button> <span id=msg class=mu></span></p></div>
 <div class=c><h2>رکوردهای جدید ثبت‌شده (${E.length})</h2><div class=f><button class=s id=cp>کپی به‌صورت CSV</button><button class=s id=clr>پاک‌کردن همه</button><span class=mu>داده‌ها در همین مرورگر ذخیره می‌شوند و در آمار داشبورد لحاظ می‌گردند.</span></div>
 ${E.length?tbl(['خط','جوینت','نوع','سایز','Fit-up','جوش','جوشکار','',''],E.map((e,i)=>`<tr><td>${esc(e.line)}</td><td>${esc(e.jn)}</td><td>${e.wt}</td><td>${e.sz}</td><td>${fd(e.fd)}</td><td>${fd(e.wd)}</td><td>${esc(e.wl)}</td><td>${e.t.map((t,k)=>t?T[k]+(t==2?'✔':'…'):'').filter(Boolean).join(' ')}</td><td><button class=s data-d="${i}">حذف</button></td></tr>`)):'<span class=mu>هنوز رکوردی ثبت نشده است.</span>'}</div>`;
}
function bindEntry(){
 const li=$('#e_line');if(!li)return;
 li.onchange=()=>{const i=D.L.indexOf(li.value);if(i>=0)$('#e_unit').value=D.LU[i]};
 $('#add').onclick=()=>{
  const v=id=>$('#'+id).value.trim(),dn=s=>s?+s.replace(/-/g,''):0,ok=s=>!s||/^\d{4}-\d{2}-\d{2}$/.test(s);
  if(!v('e_line')||!v('e_jn'))return $('#msg').textContent='شماره خط و شماره جوینت الزامی است.';
  if(!ok(v('e_fd'))||!ok(v('e_wd')))return $('#msg').textContent='قالب تاریخ باید YYYY-MM-DD باشد.';
  E.push({line:v('e_line'),unit:+v('e_unit'),jn:v('e_jn'),wt:v('e_wt'),sz:v('e_sz')||0,fd:dn(v('e_fd')),wd:dn(v('e_wd')),fc:v('e_fc'),wl:v('e_wl'),t:T.map((_,k)=>+v('e_t'+k))});
  sv();rebuild()};
 $('#clr').onclick=()=>{if(E.length&&confirm('همه رکوردهای جدید پاک شود؟')){E=[];sv();rebuild()}};
 $('#cp').onclick=()=>{const t=['line,joint,type,size,fitup,weld,welder,BP,PT,PWHT,HRD,AP',...E.map(e=>[e.line,e.jn,e.wt,e.sz,e.fd,e.wd,e.wl,...e.t].join(','))].join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('#cp').textContent='کپی شد ✔').catch(()=>prompt('CSV:',t))};
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{E.splice(+b.dataset.d,1);sv();rebuild()});
}
const sv=()=>{try{localStorage.setItem('jhe1',JSON.stringify(E))}catch(e){}};
/* ---------- router ---------- */
function route(){
 const h=location.hash.slice(1)||'dash',m=h.match(/^line-(\d+)$/),r=m?'lines':h;
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r==r));
 const app=$('#app');
 app.innerHTML=m?linePage(+m[1]):({dash,lines,front,health,entry}[h]||dash)();
 if(h=='lines')lineList();if(h=='entry')bindEntry();
 if(h=='lines'){$('#q').oninput=e=>{LF.q=e.target.value;LF.n=150;lineList()};$('#u').onchange=e=>{LF.u=e.target.value;LF.n=150;lineList()};$('#s').onchange=e=>{LF.s=e.target.value;LF.n=150;lineList()}}
 if(h=='front')$('#fs').onchange=e=>{FS=e.target.value;route()};
 window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const tr=e.target.closest('tr[data-l]');if(tr&&!e.target.closest('button'))location.hash='line-'+tr.dataset.l;const b=e.target.closest('button[data-h]');if(b){HS=+b.dataset.h;route()}});
addEventListener('hashchange',()=>D&&route());
load().catch(e=>{$('#app').innerHTML='<div class=c>خطا در بارگذاری داده: '+esc(e.message)+'</div>'});
</script></body></html>
